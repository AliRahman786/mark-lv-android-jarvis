name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project-jarvis.zip
        run: |
          unzip -o project-jarvis.zip
          
          # Move files up to root if extracted inside a subfolder
          if [ ! -d "app" ]; then
            APP_PATH=$(find . -maxdepth 2 -type d -name "app" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              PARENT_DIR=$(dirname "$APP_PATH")
              cp -rn "$PARENT_DIR"/* .
            fi
          fi

      - name: Setup Gradle Build Files
        run: |
          # 1. Create root settings file if missing
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "jarvis"
          include(":app")
          EOF
          fi

          # 2. Create root build file if missing
          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            cat << 'EOF' > build.gradle.kts
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.compose) apply false
              alias(libs.plugins.google.devtools.ksp) apply false
              alias(libs.plugins.secrets) apply false
              alias(libs.plugins.google.services) apply false
          }
          EOF
          fi

          # 3. Create dummy .env file for secrets plugin
          if [ ! -f ".env" ]; then
            echo "GEMINI_API_KEY=PLACEHOLDER_KEY" > .env
          fi

          # 4. Generate Gradle wrapper (Updated to 9.3.1 for AGP 9.1.1 compatibility)
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Compile APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mark-LIV-APK
          path: app/build/outputs/apk/debug/*.apk
