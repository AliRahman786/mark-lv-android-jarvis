name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project-jarvis.zip
        run: |
          unzip -o project-jarvis.zip
          
          # Move files to root if they were zipped inside a folder
          if [ ! -d "app" ]; then
            APP_PATH=$(find . -maxdepth 2 -type d -name "app" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              PARENT_DIR=$(dirname "$APP_PATH")
              cp -rn "$PARENT_DIR"/* .
            fi
          fi

      - name: Configure Gradle Build Files
        run: |
          # Create settings.gradle.kts if missing
          if [ ! -f "settings.gradle.kts" ]; then
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "jarvis"
          include(":app")
          EOF
          fi

          # Create build.gradle.kts if missing
          if [ ! -f "build.gradle.kts" ]; then
            cat << 'EOF' > build.gradle.kts
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.compose) apply false
              alias(libs.plugins.google.devtools.ksp) apply false
              alias(libs.plugins.secrets) apply false
              alias(libs.plugins.google.services) apply false
          }
          EOF
          fi

          # Create placeholder API Key file for the compiler
          echo "GEMINI_API_KEY=PLACEHOLDER" > .env

          # Download and configure Gradle compiler
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew

      - name: Compile JARVIS APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mark-LIV-App
          path: app/build/outputs/apk/debug/*.apk
