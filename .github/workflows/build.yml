name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project ZIP
        run: |
          # Unpack the uploaded zip file
          unzip -o *.zip

          # If the zip contents were inside a subfolder, move them to the root
          if [ ! -d "app" ]; then
            APP_PATH=$(find . -maxdepth 2 -type d -name "app" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              PARENT_DIR=$(dirname "$APP_PATH")
              cp -rn "$PARENT_DIR"/* .
            fi
          fi

      - name: Configure Root Gradle & Settings
        run: |
          # 1. Create root settings file if missing
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "jarvis"
          include(":app")
          EOF
          fi

          # 2. Create root build file if missing
          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            cat << 'EOF' > build.gradle.kts
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.compose) apply false
              alias(libs.plugins.google.devtools.ksp) apply false
              alias(libs.plugins.secrets) apply false
              alias(libs.plugins.google.services) apply false
          }
          EOF
          fi

          # 3. Create dummy .env file if missing so the secrets plugin succeeds
          if [ ! -f ".env" ]; then
            echo "GEMINI_API_KEY=PLACEHOLDER_KEY" > .env
          fi

          # 4. Generate Gradle wrapper
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew

      - name: Compile APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mark-liv-apk
          path: app/build/outputs/apk/debug/*.apk
